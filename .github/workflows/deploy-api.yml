name: Deploy API (rsync)

on:
  workflow_dispatch:
  push:
    branches: ['master']
    paths: ['packages/api/**', 'packages/core/**', 'package-lock.json']

jobs:
  test:
    uses: ./.github/workflows/test-api.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Before touching the live directory: the DB config lives in core's .env
      - name: Check server env files
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: api.pumpking.top
          username: piutop
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            test -f ~/pumpking-deployment/packages/core/.env || { echo "packages/core/.env is missing"; exit 1; }
            test -f ~/pumpking-deployment/packages/api/.env || { echo "packages/api/.env is missing"; exit 1; }

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='.git' --exclude='node_modules' --exclude='.env' --exclude='packages/web'
          path: ./
          remote_path: ~/pumpking-deployment/
          remote_host: api.pumpking.top
          remote_user: piutop
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run migrations and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: api.pumpking.top
          username: piutop
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/pumpking-deployment
            echo "-- Installing dependencies"
            npm ci
            echo "-- Running migrations"
            npm run migrate:latest --prefix packages/core
            cd ~/pumpking-deployment/packages/api
            echo "-- Restarting PM2"
            npm run pm2
            echo "-- Health check"
            curl -fsS --retry 15 --retry-delay 2 --retry-all-errors \
              --resolve api.pumpking.top:3001:127.0.0.1 https://api.pumpking.top:3001/healthz
            echo
            echo "-- Deployment complete!"
