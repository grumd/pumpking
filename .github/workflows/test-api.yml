name: Test API

on:
  workflow_call:
  pull_request:
    branches: ['master']
    paths: ['packages/api/**', 'packages/core/**']

jobs:
  test_api:
    runs-on: ubuntu-latest

    steps:
      - name: Setup MySQL
        run: sudo systemctl start mysql.service

      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci

      - name: 'Create core .env file'
        uses: iamsauravsharma/create-dotenv@v1.2.2
        with:
          file-name: '.env'
          directory: 'packages/core'
        env:
          DB_DATABASE_TEST: test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: 'Create API .env file'
        uses: iamsauravsharma/create-dotenv@v1.2.2
        with:
          file-name: '.env'
          directory: 'packages/api'
        env:
          SCREENSHOT_BASE_FOLDER: ~/test-screenshots
          SCREENSHOT_AGENT_BASE_FOLDER: ~/test-screenshots
          SCREENSHOT_FILE_PATH_DB: '{nickname}/{dateAdded}/{dateTimeAdded}.jpg'

      - name: Type-check core
        run: npm run ts-check --prefix packages/core

      - name: Type-check API
        run: npm run ts-check --prefix packages/api

      - name: Test API
        run: npm run test:api
