name: Test a service

# Type-checks and tests one service. Called by the PR test workflows and by the Deploy
# workflow, whose migration guard runs a deployed commit's tests on new migrations
on:
  workflow_call:
    inputs:
      service:
        description: api, ingest or bot
        required: true
        type: string
      ref:
        description: The commit to test (default the one that triggered the workflow)
        type: string
        default: ''
      migrations_from:
        description: Test with this commit's packages/database/migrations instead
        type: string
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup MySQL
        run: sudo systemctl start mysql.service

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # Commits from before packages/core was renamed (PR #45) have the database package
      # in packages/core. Until every deployed/<service> tag is past the rename, the
      # migration guard tests such commits
      - name: Find the database package
        id: db
        run: |
          if [ -d packages/database ]; then
            echo "dir=packages/database" >> "$GITHUB_OUTPUT"
          else
            echo "dir=packages/core" >> "$GITHUB_OUTPUT"
          fi

      - name: Use the migrations of ${{ inputs.migrations_from }}
        if: inputs.migrations_from != ''
        run: |
          git fetch --depth 1 origin ${{ inputs.migrations_from }}
          rm -rf ${{ steps.db.outputs.dir }}/migrations
          git checkout FETCH_HEAD -- packages/database/migrations
          if [ ${{ steps.db.outputs.dir }} = packages/core ]; then
            mv packages/database/migrations packages/core/migrations
            rmdir packages/database
          fi

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci

      - name: 'Create database .env file'
        uses: iamsauravsharma/create-dotenv@v1.2.2
        with:
          file-name: '.env'
          directory: ${{ steps.db.outputs.dir }}
        env:
          DB_DATABASE_TEST: test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: 'Create API .env file'
        if: inputs.service == 'api'
        uses: iamsauravsharma/create-dotenv@v1.2.2
        with:
          file-name: '.env'
          directory: 'packages/api'
        env:
          SCREENSHOT_BASE_FOLDER: ~/test-screenshots
          SCREENSHOT_AGENT_BASE_FOLDER: ~/test-screenshots
          SCREENSHOT_FILE_PATH_DB: '{nickname}/{dateAdded}/{dateTimeAdded}.jpg'

      - name: Type-check the database package
        run: npm run ts-check --prefix ${{ steps.db.outputs.dir }}

      - name: Type-check ${{ inputs.service }}
        run: npm run ts-check --prefix packages/${{ inputs.service }}

      - name: Test ${{ inputs.service }}
        run: npm run test:${{ inputs.service }}
