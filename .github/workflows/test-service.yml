name: Test a service

# Type-checks and tests one service. Called by the PR test workflows and by the Deploy
# workflow, whose migration guard runs a deployed commit's tests on new migrations
on:
  workflow_call:
    inputs:
      service:
        description: api, ingest or bot
        required: true
        type: string
      ref:
        description: The commit to test (default the one that triggered the workflow)
        type: string
        default: ''
      migrations_from:
        description: Test with this commit's packages/core/migrations instead
        type: string
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup MySQL
        run: sudo systemctl start mysql.service

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Use the migrations of ${{ inputs.migrations_from }}
        if: inputs.migrations_from != ''
        run: |
          git fetch --depth 1 origin ${{ inputs.migrations_from }}
          rm -rf packages/core/migrations
          git checkout FETCH_HEAD -- packages/core/migrations

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci

      - name: 'Create core .env file'
        uses: iamsauravsharma/create-dotenv@v1.2.2
        with:
          file-name: '.env'
          directory: 'packages/core'
        env:
          DB_DATABASE_TEST: test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: 'Create API .env file'
        if: inputs.service == 'api'
        uses: iamsauravsharma/create-dotenv@v1.2.2
        with:
          file-name: '.env'
          directory: 'packages/api'
        env:
          SCREENSHOT_BASE_FOLDER: ~/test-screenshots
          SCREENSHOT_AGENT_BASE_FOLDER: ~/test-screenshots
          SCREENSHOT_FILE_PATH_DB: '{nickname}/{dateAdded}/{dateTimeAdded}.jpg'

      - name: Type-check core
        run: npm run ts-check --prefix packages/core

      - name: Type-check ${{ inputs.service }}
        run: npm run ts-check --prefix packages/${{ inputs.service }}

      - name: Test ${{ inputs.service }}
        run: npm run test:${{ inputs.service }}
