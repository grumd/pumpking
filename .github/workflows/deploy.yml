name: Deploy

# Deploys the services that run on the production host (api, ingest, bot). The web has
# its own workflow. See "What P2 did" in docs/python-api-migration/PLAN.md
on:
  push:
    branches: ['master']
    paths:
      - 'packages/api/**'
      - 'packages/ingest/**'
      - 'packages/bot/**'
      - 'packages/database/**'
      - 'packages/utils/**'
      - 'package.json'
      - 'package-lock.json'
      - 'pm2.config.js'
      - 'deploy/**'

concurrency:
  group: deploy

# To move the deployed/<service> tags
permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ingest: ${{ steps.filter.outputs.ingest }}
      bot: ${{ steps.filter.outputs.bot }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # A service deploys when its own package changes, or what every service runs
          # with. A migration alone only migrates (in the release job); one that also
          # regenerates the types in packages/database/src deploys every service
          filters: |
            shared: &shared
              - 'packages/database/src/**'
              - 'packages/database/package.json'
              - 'packages/utils/**'
              - 'package.json'
              - 'package-lock.json'
              - 'pm2.config.js'
              - 'deploy/**'
            api:
              - *shared
              - 'packages/api/**'
            ingest:
              - *shared
              - 'packages/ingest/**'
            bot:
              - *shared
              - 'packages/bot/**'
            migrations:
              - 'packages/database/migrations/**'

  test-api:
    uses: ./.github/workflows/test-service.yml
    with:
      service: api

  test-ingest:
    uses: ./.github/workflows/test-service.yml
    with:
      service: ingest

  test-bot:
    uses: ./.github/workflows/test-service.yml
    with:
      service: bot

  # Migration guard: the deployed services must keep working on the new schema, until
  # they're redeployed (or if their deploy fails and they stay on the old release)
  guard-api:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    uses: ./.github/workflows/test-service.yml
    with:
      service: api
      ref: deployed/api
      migrations_from: ${{ github.sha }}

  guard-ingest:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    uses: ./.github/workflows/test-service.yml
    with:
      service: ingest
      ref: deployed/ingest
      migrations_from: ${{ github.sha }}

  guard-bot:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    uses: ./.github/workflows/test-service.yml
    with:
      service: bot
      ref: deployed/bot
      migrations_from: ${{ github.sha }}

  release:
    needs: [test-api, test-ingest, test-bot, guard-api, guard-ingest, guard-bot]
    # Run when nothing failed: the guard jobs are skipped when no migrations changed
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload the release
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az --exclude='.git' --exclude='node_modules' --exclude='packages/web'
          path: ./
          remote_path: ~/pumpking/releases/${{ github.sha }}/
          remote_host: api.pumpking.top
          remote_user: piutop
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install and migrate
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: api.pumpking.top
          username: piutop
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: bash ~/pumpking/releases/${{ github.sha }}/deploy/release.sh ${{ github.sha }}

  deploy-api:
    needs: [changes, release]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.api == 'true' }}
    uses: ./.github/workflows/deploy-service.yml
    with:
      service: api
    secrets: inherit

  deploy-ingest:
    needs: [changes, release]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.ingest == 'true' }}
    uses: ./.github/workflows/deploy-service.yml
    with:
      service: ingest
    secrets: inherit

  deploy-bot:
    needs: [changes, release]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.bot == 'true' }}
    uses: ./.github/workflows/deploy-service.yml
    with:
      service: bot
    secrets: inherit
