name: SSH to the server
description: Sets up `ssh pumpking` / `rsync … pumpking:…` for the production host

inputs:
  key:
    description: The deploy user's private key
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SSH_KEY: ${{ inputs.key }}
      run: |
        install -m 700 -d ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/pumpking
        chmod 600 ~/.ssh/pumpking
        # The host's key, pinned instead of trusted on first use
        echo 'api.pumpking.top ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILozTgc1dqURsBUh90uCZtVFGw7UgzxVQ0Kegdr3ogPR' >> ~/.ssh/known_hosts
        cat >> ~/.ssh/config <<'EOF'
        Host pumpking
          HostName api.pumpking.top
          User piutop
          IdentityFile ~/.ssh/pumpking
          IdentitiesOnly yes
        EOF
